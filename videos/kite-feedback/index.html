<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {font-family:Onest;src:url("assets/Onest.woff2")}
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F6F4EE;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-duration="36"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-signal"
        class="scene clip"
        data-composition-id="01-signal"
        data-composition-src="compositions/frames/01-signal.html"
        data-start="3.6"
        data-duration="8.4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-drafts"
        class="scene clip"
        data-composition-id="02-drafts"
        data-composition-src="compositions/frames/02-drafts.html"
        data-start="12"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-03-review"
        class="scene clip"
        data-composition-id="03-review"
        data-composition-src="compositions/frames/03-review.html"
        data-start="24"
        data-duration="12"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm" data-automation="{&quot;version&quot;: 1, &quot;lanes&quot;: [{&quot;target&quot;: &quot;volume&quot;, &quot;points&quot;: [{&quot;t&quot;: 0, &quot;v&quot;: 0}, {&quot;t&quot;: 0.5, &quot;v&quot;: 0.72}, {&quot;t&quot;: 33.4, &quot;v&quot;: 0.72}, {&quot;t&quot;: 36, &quot;v&quot;: 0}]}]}"
        src="assets/music.wav"
        data-start="0"
        data-duration="36"
        data-track-index="11"
        data-volume="0.72"
      ></audio>
<video id="human-review" class="clip" src="assets/marketer.mp4" muted playsinline data-start="28.4" data-duration="3.6" data-media-start="0.4" data-track-index="3" style="position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;z-index:30"></video>
<video id="human-opening" class="clip" src="assets/marketer-opening.mp4" muted playsinline data-start="0" data-duration="3.6" data-media-start="0" data-track-index="3" style="position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;z-index:30"></video>
<div id="opening-copy" class="clip" data-composition-id="opening-photo-title" data-composition-src="compositions/frames/opening-photo-title.html" data-start="0" data-duration="3.6" data-track-index="4" style="position:absolute;inset:0;width:1920px;height:1080px;z-index:40"></div>
<div id="review-copy" class="clip" data-composition-id="review-photo-title" data-composition-src="compositions/frames/review-photo-title.html" data-start="28.4" data-duration="3.6" data-track-index="4" style="position:absolute;inset:0;width:1920px;height:1080px;z-index:40"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
