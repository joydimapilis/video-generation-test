<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #171a19;
      }
      body {
        font-family: CueSans, Arial, sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
      @font-face{font-family:CueSans;src:url('assets/Arial.ttf')}
      @font-face{font-family:CueSans;src:url('assets/Arial-Bold.ttf');font-weight:700}
      *{letter-spacing:0}
      #root,.clip{width:1920px;height:1080px;overflow:hidden}
      .clip{position:absolute;inset:0}
    </style>
  </head>
  <body>
    <div data-hf-id="hf-jrv3" id="root" data-composition-id="cue" data-start="0" data-duration="30" data-width="1920" data-height="1080">
