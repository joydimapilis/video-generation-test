<!doctype html><html><head><meta charset="utf-8"></head><body><template>
<style>
#journey-root{position:absolute;inset:0;width:1920px;height:1080px;background:#080d0a;overflow:hidden}
#journey-canvas{position:absolute;inset:0;width:1920px;height:1080px;transform-origin:62% 50%}
#journey-canvas path{fill:none;stroke:#ff4818;stroke-width:9;stroke-linecap:round}
.journey-word{position:absolute;font-size:84px;font-weight:700;line-height:1.15;color:#fafafa;white-space:nowrap}
#journey-post{left:270px;top:390px;width:310px}#journey-viral{left:780px;top:640px;width:420px}#journey-paid{left:1310px;top:310px;width:480px}
#journey-setup{position:absolute;left:480px;top:425px;width:960px;height:230px;border:3px solid #c7481a;border-radius:115px;display:flex;align-items:center;justify-content:center;color:#ffb02e;font-weight:700;font-size:108px;background:#0b100d}
</style>
<div id="journey-root" data-composition-id="journey" data-duration="9" data-width="1920" data-height="1080">
<svg id="journey-canvas" viewBox="0 0 1920 1080" aria-label="Orange trail connecting the three actions">
<defs><filter id="journey-bloom" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur stdDeviation="15"/></filter></defs>
<path id="journey-line" d="M 0 540 L 550 540 C 720 540 850 485 1070 495 S 1290 535 1370 475 S 1490 380 1720 390"/>
<g id="journey-tip"><circle r="23" fill="#ff8c37" filter="url(#journey-bloom)"/><circle r="8" fill="#ffe0aa"/></g>
</svg>
<div class="journey-word" id="journey-post">Post.</div><div class="journey-word" id="journey-viral">Go viral.</div><div class="journey-word" id="journey-paid">Get paid.</div>
<div id="journey-setup">Setup Payouts</div>
</div>
<script>(()=>{
const tl=gsap.timeline({paused:true});const path=document.getElementById('journey-line');const tip=document.getElementById('journey-tip');const length=path.getTotalLength();const state={p:0.42};
const draw=()=>{path.style.strokeDasharray=String(length);path.style.strokeDashoffset=String(length*(1-state.p));const point=path.getPointAtLength(length*state.p);tip.setAttribute('transform',`translate(${point.x} ${point.y})`);};draw();
tl.fromTo(state,{p:0.42},{p:1,duration:6.4,ease:'none',onUpdate:draw},0);
tl.fromTo('#journey-canvas',{scale:6,x:1380},{scale:1,x:0,duration:3.3,ease:'power3.inOut'},0);
[['#journey-post',3.1],['#journey-viral',4.15],['#journey-paid',5.2]].forEach(([id,t])=>{tl.fromTo(id,{opacity:0,y:22},{opacity:1,y:0,duration:0.4,ease:'power3.out'},t);});
tl.to(['#journey-canvas','.journey-word'],{opacity:0,duration:0.35},6.6);
tl.fromTo('#journey-setup',{scale:0.8,opacity:0},{scale:1,opacity:1,duration:0.7,ease:'power3.out'},7);
tl.to('#journey-setup',{scale:0.97,duration:0.12,ease:'power2.in'},8.6);tl.to('#journey-setup',{scale:1,duration:0.2,ease:'power2.out'},8.72);
window.__timelines.journey=tl;
})();</script></template></body></html>
